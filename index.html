<head>
  <script type="text/javascript">
    function showTime() {
      var date = new Date();
      var h = date.getHours();
      var m = date.getMinutes();
      var s = date.getSeconds();

      // Ajouter un zéro devant les chiffres inférieurs à 10 pour le format 2 chiffres
      if (h < 10) { h = '0' + h; }
      if (m < 10) { m = '0' + m; }
      if (s < 10) { s = '0' + s; }

      var time = h + ':' + m + ':' + s;
      document.getElementById('horloge').innerHTML = time;

      setTimeout(showTime, 1000); // Met à jour toutes les 1000ms = 1s
    }
  </script>
</head>
<body onload="showTime();">
  <span id="horloge" style="font-size:40px; color:#333;"></span>
    </body>
